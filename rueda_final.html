function buildHistorialSVG(isos) {
  const w = Math.max(560, Math.min(1000, isos.length * 26)), h = 220;
  const padL = 34, padR = 14, padT = 14, padB = 26;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const scores = isos.map(iso => weightedDailyScore(state.checkins[iso].ratings));
  const step = isos.length > 1 ? plotW / (isos.length - 1) : 0;

  let svg = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" xmlns="http://www.w3.org/2000/svg">';
  // grid + y labels
  [0,2,4,6,8,10].forEach(v => {
    const y = padT + plotH - (v/10)*plotH;
    svg += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (w-padR) + '" y2="' + y.toFixed(1) + '" stroke="#e5ded0" stroke-width="1"/>';
    svg += '<text x="' + (padL-8) + '" y="' + (y+3).toFixed(1) + '" text-anchor="end" font-size="9.5" fill="#6b6558" font-family="-apple-system,sans-serif">' + v + '</text>';
  });

  // build path over available points
  const pts = [];
  isos.forEach((iso, i) => {
    const s = scores[i];
    if (s === null) return;
    const x = padL + i*step;
    const y = padT + plotH - (s/10)*plotH;
    pts.push([x,y,iso,s]);
  });

  if (pts.length > 1) {
    let path = 'M ' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
    for (let i = 1; i < pts.length; i++) path += ' L ' + pts[i][0].toFixed(1) + ' ' + pts[i][1].toFixed(1);
    let areaPath = path + ' L ' + pts[pts.length-1][0].toFixed(1) + ' ' + (padT+plotH) + ' L ' + pts[0][0].toFixed(1) + ' ' + (padT+plotH) + ' Z';
    svg += '<path d="' + areaPath + '" fill="rgba(184,107,75,0.14)" stroke="none"/>';
    svg += '<path d="' + path + '" fill="none" stroke="#B86B4B" stroke-width="2"/>';
  }
  pts.forEach(pt => {
    svg += '<circle cx="' + pt[0].toFixed(1) + '" cy="' + pt[1].toFixed(1) + '" r="3" fill="#96543a"><title>' + fmtDate(pt[2]) + ': ' + pt[3].toFixed(1) + '/10</title></circle>';
  });

  // x labels (thin out to avoid clutter)
  const labelEvery = Math.max(1, Math.ceil(isos.length / 8));
  isos.forEach((iso, i) => {
    if (i % labelEvery !== 0 && i !== isos.length-1) return;
    const x = padL + i*step;
    svg += '<text x="' + x.toFixed(1) + '" y="' + (h-8) + '" text-anchor="middle" font-size="9" fill="#6b6558" font-family="-apple-system,sans-serif">' + iso.slice(5) + '</text>';
  });

  svg += '</svg>';
  return svg;
}

  const hiddenCount = cap ? Math.max(0, allRealSessions.length - cap) : 0;

  // roadmap items not already represented by a real session close in date (+/-5 días)
  const roadmapPast = [], roadmapFuture = [];
  ROADMAP.forEach(m => {
    const dueDate = addDaysISO(startIso, m.offsetDays);
    const hasRealSession = state.sessions.some(s => Math.abs(daysBetween(s.date, dueDate)) <= 5);
    if (dueDate <= todayIso) {
      if (!hasRealSession) roadmapPast.push({ m: m, dueDate: dueDate, pending: true });
    } else {
      roadmapFuture.push({ m: m, dueDate: dueDate });
    }
  });

  let html = '<div class="sessions-columns">';

  /* --- Sesiones Pasadas --- */
  html += '<div>';
  html += '<div class="section-title">Sesiones Pasadas</div>';
  if (!realSessions.length && !roadmapPast.length) {
    html += '<div class="empty-state">Aún no hay sesiones registradas. Se registrarán automáticamente después de cada control con Manuel.</div>';
  }
  roadmapPast.forEach(rp => {
    html += '<div class="roadmap-mini pending">';
    html += '<div class="rm-tag">' + rp.m.tag + ' · PENDIENTE DE REGISTRO</div>';
    html += '<h4>' + rp.m.title + '</h4>';
    html += '<p>' + rp.m.desc + '</p>';
    html += '<div class="rm-date">Estimada: ' + fmtDate(rp.dueDate) + '</div>';
    html += '</div>';
  });
  realSessions.forEach(s => {
    html += '<div class="session-item">';
    html += '<div class="session-head" onclick="toggleSession(\'' + s.id + '\')">';
    html += '  <div><div class="sdate">' + fmtDate(s.date) + '</div><h4>' + escapeHtml(s.title) + '</h4></div>';
    html += '  <div class="session-badges">';
    if (s.videoLink) html += '<span class="session-badge has">Video</span>';
    if (s.transcript) html += '<span class="session-badge has">Transcript</span>';
    if (s.feedback) html += '<span class="session-badge has">Feedback</span>';
    html += '  </div>';
    html += '</div>';
    html += '<div class="session-body" id="sessionBody_' + s.id + '">';
    if (s.summary) html += '<h5>Resumen</h5><p style="font-size:12.5px;margin:0;">' + escapeHtml(s.summary) + '</p>';
    if (s.keyPoints && s.keyPoints.length) html += '<h5>Puntos clave</h5><ul>' + s.keyPoints.map(k => '<li>' + escapeHtml(k) + '</li>').join('') + '</ul>';
    if (s.videoLink) html += '<h5>Video</h5><a class="video-link" href="' + escapeHtml(s.videoLink) + '" target="_blank" rel="noopener">Ver grabación de la sesión →</a>';
    if (s.transcript) html += '<h5>Transcript / notas</h5><div class="transcript-box">' + escapeHtml(s.transcript) + '</div>';
    if (s.feedback) html += '<h5>Feedback post-sesión</h5><div class="feedback-box"><span class="feedback-tag">Generado automáticamente</span>' + escapeHtml(s.feedback) + '</div>';
    html += '</div>';
    html += '</div>';
  });
  if (hiddenCount > 0) {
    html += '<div class="resource-card locked" style="margin-top:4px;">';
    html += '<div class="resource-lock-badge">🔒 ' + hiddenCount + ' resumen' + (hiddenCount===1?'':'es') + ' de sesión más</div>';
    html += '<div class="resource-unlock-note">Tu plan (' + escapeHtml(tier.label) + ') incluye hasta ' + cap + ' resúmenes de sesión visibles. Con 3M Pro o superior quedan disponibles todos, sin límite.</div>';
    html += '</div>';
  }
  html += '</div>';

  /* --- Próximas Sesiones --- */
  html += '<div>';
  html += '<div class="section-title">Próximas Sesiones</div>';
  if (!roadmapFuture.length) {
    html += '<div class="empty-state">No hay controles agendados por delante — programa cerrado o completo.</div>';
  }
  roadmapFuture.forEach(rf => {
    html += '<div class="roadmap-mini">';
    html += '<div class="rm-tag">' + rf.m.tag + '</div>';
    html += '<h4>' + rf.m.title + '</h4>';
    html += '<p>' + rf.m.desc + '</p>';
    html += '<div class="rm-date">Estimada: ' + fmtDate(rf.dueDate) + '</div>';
    html += '</div>';
  });
  html += '<div class="auto-note">Las sesiones se registran automáticamente al finalizar cada videollamada — fecha, resumen, transcript y feedback quedan guardados sin que tengas que hacer nada.</div>';
  html += '</div>';

  html += '</div>'; // sessions-columns
  return html;
}

function toggleSession(id) {
  const el = document.getElementById('sessionBody_' + id);
  if (el) el.classList.toggle('open');
}

/* ============================= TAB: MI DATA ============================= */
function renderData() {
  const allIsos = Object.keys(state.checkins).sort();
  const scores = allIsos.map(iso => weightedDailyScore(state.checkins[iso].ratings)).filter(s => s !== null);
  const avg = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length) : null;
  const daysSinceStart = Math.max(1, daysBetween(state.patient.startDate, todayISO()) + 1);
  const adherence = Math.round(allIsos.length / daysSinceStart * 100);

  let html = '<div class="stat-chips">';
  html += statChip(allIsos.length, 'Check-ins registrados');
  html += statChip(avg !== null ? avg.toFixed(1) : '—', 'Bienestar general prom.');
  html += statChip(adherence + '%', 'Adherencia');
  html += statChip(state.sessions.length, 'Sesiones');
  html += '</div>';

  html += '<div class="card">';
  html += '<h3>Exportar mi data</h3>';
  html += '<div class="card-sub">Toda tu información queda en tus manos. Descárgala cuando quieras, completa o hasta una fecha específica.</div>';

  html += '<div class="data-actions">';
  html += '<div class="data-row">';
  html += '<button class="btn primary" onclick="downloadAllJSON()">Descargar todo (JSON)</button>';
  html += '<button class="btn" onclick="downloadAllCSV()">Descargar check-ins (CSV)</button>';
  html += '<button class="btn" onclick="downloadMeasurementsCSV()">Descargar mediciones (CSV)</button>';
  html += '<button class="btn" onclick="downloadSessionsCSV()">Descargar sesiones (CSV)</button>';
  html += '</div>';
  html += '<div style="border-top:1px solid var(--line); padding-top:14px; margin-top:6px;">';
  html += '<label>Descargar solo hasta esta fecha</label>';
  html += '<div class="data-row">';
  html += '<input type="date" id="uptoDate" value="' + todayISO() + '" max="' + todayISO() + '">';
  html += '<button class="btn" onclick="downloadUpTo()">Descargar hasta esta fecha (JSON)</button>';
  html += '</div>';
  html += '</div>';
  html += '</div>';
  html += '</div>';
  return html;
}

function downloadBlob(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadCSV(filename, headers, rows) {
  const esc = v => { v = String(v === undefined || v === null ? '' : v); return '"' + v.replace(/"/g,'""') + '"'; };
  const lines = [headers.map(esc).join(',')].concat(rows.map(r => r.map(esc).join(',')));
  downloadBlob(filename, lines.join('\n'), 'text/csv;charset=utf-8');
}

function downloadAllJSON() {
  downloadBlob('sobi-data-completa.json', JSON.stringify(state, null, 2), 'application/json');
}
function downloadAllCSV() {
  const allIsos = Object.keys(state.checkins).sort();
  const headers = ['fecha', 'tipo_dia', ...state.pillars.map(p => p.name), 'bienestar_ponderado', 'nota'];
  const rows = allIsos.map(iso => {
    const c = state.checkins[iso];
    const wscore = weightedDailyScore(c.ratings);
    return [iso, c.type || '', ...state.pillars.map(p => c.ratings[p.id] !== undefined ? c.ratings[p.id] : ''), wscore !== null ? wscore.toFixed(2) : '', (c.note||'').replace(/\n/g,' ')];
  });
  downloadCSV('sobi-checkins-completo.csv', headers, rows);
}
function downloadSessionsCSV() {
  const headers = ['fecha', 'titulo', 'resumen', 'puntos_clave', 'video', 'feedback'];
  const rows = state.sessions.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(s => [s.date, s.title, s.summary, (s.keyPoints||[]).join(' | '), s.videoLink, s.feedback]);
  downloadCSV('sobi-sesiones.csv', headers, rows);
}
function downloadUpTo() {
  const upto = document.getElementById('uptoDate').value || todayISO();
  const filteredCheckins = {};
  Object.keys(state.checkins).filter(iso => iso <= upto).forEach(iso => filteredCheckins[iso] = state.checkins[iso]);
  const filteredMeasurements = {};
  Object.keys(state.measurements || {}).filter(iso => iso <= upto).forEach(iso => filteredMeasurements[iso] = state.measurements[iso]);
  const filteredSessions = state.sessions.filter(s => s.date <= upto);
  const snapshot = { patient: state.patient, pillars: state.pillars, checkins: filteredCheckins, measurements: filteredMeasurements, sessions: filteredSessions, exportadoHasta: upto };
  downloadBlob('sobi-data-hasta-' + upto + '.json', JSON.stringify(snapshot, null, 2), 'application/json');
}

/* ============================= INIT ============================= */
bootstrap();
</script>
