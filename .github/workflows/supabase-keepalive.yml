name: Supabase keep-alive

# Evita que Supabase (plan Free) pause el proyecto por inactividad (7 días).
# La anon/publishable key es pública (ya está en config.js), no es secreta.

on:
  schedule:
    - cron: "17 12 */2 * *"   # cada 2 días, 12:17 UTC
  workflow_dispatch: {}        # permite correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://emrlmvaelixpxrinzzzw.supabase.co
      SUPABASE_KEY: sb_publishable_Nov2WzyA_ez5msRix9xZhQ_GG0NOQCm
    steps:
      - name: Consulta a la base de datos (REST)
        run: |
          code=$(curl -sS -o resp.json -w "%{http_code}" --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/templates?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "REST status: $code"; cat resp.json; echo
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

      - name: Ping a Auth
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_KEY")
          echo "Auth status: $code"
          [ "$code" -eq 200 ]
