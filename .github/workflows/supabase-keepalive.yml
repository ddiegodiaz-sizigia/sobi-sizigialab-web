name: Supabase keep-alive

# Evita que Supabase (plan Free) pause el proyecto por inactividad (7 días sin actividad real en la base).
# Antes era un GET cada 2 días y no bastó (pausa 3-nov-2026). Ahora escribe en la base vía el RPC
# keepalive_ping() (migración 20261110_keepalive.sql) cada 6 horas.
# La anon/publishable key es pública (ya está en config.js), no es secreta.
# Si falla, GitHub envía un correo a quien editó este archivo: un fallo aquí suele ser el proyecto pausado.

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas, minuto 17 UTC
  workflow_dispatch: {}       # permite correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://emrlmvaelixpxrinzzzw.supabase.co
      SUPABASE_KEY: sb_publishable_Nov2WzyA_ez5msRix9xZhQ_GG0NOQCm
    steps:
      - name: Escritura en la base (RPC keepalive_ping)
        run: |
          code=$(curl -sS -o resp.json -w "%{http_code}" --retry 3 --retry-delay 10 -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "RPC status: $code"; cat resp.json; echo
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

      - name: Ping a Auth
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_KEY")
          echo "Auth status: $code"
          [ "$code" -eq 200 ]
